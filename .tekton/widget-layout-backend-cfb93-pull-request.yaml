apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/RedHatInsights/widget-layout-backend?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/pull_request_number: '{{pull_request_number}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: 'true'
    pipelinesascode.tekton.dev/max-keep-runs: '3'
    pipelinesascode.tekton.dev/on-cel-expression: event == "pull_request" && target_branch == "master"
    pipelinesascode.tekton.dev/pipeline: https://github.com/RedHatInsights/konflux-pipelines/blob/main/pipelines/docker-build-run-unit-tests-dynamic-env.yaml
  creationTimestamp:
  labels:
    appstudio.openshift.io/application: widget-layout-backend
    appstudio.openshift.io/component: widget-layout-backend-cfb93
    pipelines.appstudio.openshift.io/type: build
  name: widget-layout-backend-cfb93-on-pull-request
  namespace: hcc-platex-services-tenant
spec:
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: output-image
    value: quay.io/redhat-user-workloads/hcc-platex-services-tenant/widget-layout-backend-cfb93:on-pr-{{revision}}
  - name: image-expires-after
    value: 5d
  - name: dockerfile
    value: Dockerfile
  - name: path-context
    value: .
  - name: PGSQL_USER
    value: widget
  - name: PGSQL_PASSWORD
    value: widget
  - name: PGSQL_HOSTNAME
    value: localhost
  - name: PGSQL_PORT
    value: '5432'
  - name: PGSQL_DATABASE
    value: db
  - name: UNLEASH_API_TOKEN
    value: default:development.unleash-insecure-api-token
  - name: UNLEASH_ADMIN_TOKEN
    value: '*:*.unleash-insecure-api-token'
  - name: env-vars
    value: |
      PGSQL_USER=widget
      PGSQL_PASSWORD=widget
      PGSQL_HOSTNAME=localhost
      PGSQL_PORT=5432
      PGSQL_DATABASE=db
      UNLEASH_API_TOKEN=default:development.unleash-insecure-api-token
      UNLEASH_ADMIN_TOKEN=*:*.unleash-insecure-api-token
  - name: unit-tests-script
    value: |
      #!/bin/bash
      set -ex

      export GOTOOLCHAIN=auto

      make generate
      curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b $(go env GOPATH)/bin
      export PATH="$(go env GOPATH)/bin:$PATH"
      golangci-lint run --timeout=5m
      make test
  pipelineRef:
    name: docker-build
  taskRunTemplate:
    serviceAccountName: build-pipeline-widget-layout-backend-cfb93
  workspaces:
  - name: workspace
    volumeClaimTemplate:
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}
